version: "3"

# Every repeated command lives here (`task --list`).

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    desc: Run vet and unit tests
    cmds: [task: vet, task: test]

  check:
    desc: Everything CI checks (fmt, vet, lint incl. context checks, tests, tidy, SPDX headers)
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - task: vet
      - task: lint
      - task: test
      - go mod tidy -diff
      - task: spdx

  build:
    desc: Build the agent for this machine into bin/
    cmd: go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/hospitium-agent

  build:pi:
    desc: Build a static ARMv6 binary (runs on every Raspberry Pi, original through current) into bin/
    env: { GOOS: linux, GOARCH: arm, GOARM: "6" }
    cmd: go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/hospitium-agent-linux-armv6 ./cmd/hospitium-agent

  vet:
    cmd: go vet ./...
  lint:
    desc: golangci-lint (contextcheck, noctx, sloglint, gosec, ...)
    cmd: golangci-lint run ./...
  fmt:
    cmd: gofmt -w -s .
  test:
    desc: Unit tests (no network, no hardware)
    cmd: go test -count=1 ./...
  vuln:
    cmd: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  spdx:
    desc: Fail if a Go file lacks the SPDX header
    cmd: |
      missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $(git ls-files -co --exclude-standard '*.go') || true)
      if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  # ---- releases ----
  # A vX.Y.Z tag on origin/main publishes the Pi binaries (release.yaml), cut only through
  # `task release`. Hubs in the field install these, so every guard below exists so an agent
  # cannot publish one by mistake.
  #
  # Runs in go-task's embedded shell: use only git, gh, go and shell builtins (no grep/head on
  # the Windows PATH), and never two variables whose names differ only by case (they are one
  # variable on Windows).

  release:
    desc: >-
      Release: tag the tip of origin/main after CI, publishing the Pi binaries.
      Usage: task release BUMP=patch|minor|major   (DRY_RUN=1 checks everything without tagging)
    silent: true
    cmds:
      - |
        set -eu
        bump="{{.BUMP | default ""}}"
        dry="{{.DRY_RUN | default ""}}"
        case "$bump" in major|minor|patch) : ;; *) echo "Usage: task release BUMP=patch|minor|major" >&2; exit 1 ;; esac
        # Tag what was PUSHED, never the local HEAD: HEAD can hold commits nobody pushed or reviewed.
        git fetch --quiet origin main --tags
        sha="$(git rev-parse origin/main)"
        unpushed="$(git rev-list --count origin/main..HEAD)"
        [ "$unpushed" = "0" ] || echo "release: HEAD has ${unpushed} unpushed commit(s); they are NOT in this release."
        existing="$(git tag --points-at "$sha")"
        [ -z "$existing" ] || { echo "origin/main (${sha}) is already released as ${existing}." >&2; exit 1; }
        latest="$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')"
        [ -n "$latest" ] || latest="v0.0.0"
        new="$({{.TASK_EXE}} release:next LATEST="$latest" BUMP="$bump")"
        echo "release: ${latest} -> ${new} at ${sha}"
        # The released go.mod must build from published modules only.
        gomod="$(git show "${sha}:go.mod")"
        case "$gomod" in *replace*) echo "release: go.mod at ${sha} has a replace directive; release the dependency and require its tag." >&2; exit 1 ;; esac
        # Build exactly this commit from published modules only: no go.work, read-only go.mod. This
        # fails if the protocol version it requires was never tagged.
        wt="$(git rev-parse --absolute-git-dir)/release-check"
        git worktree remove --force "$wt" 2>/dev/null || true
        git worktree add --quiet --detach "$wt" "$sha"
        set +e
        out="$(cd "$wt" && GOWORK=off GOFLAGS=-mod=readonly go build ./... 2>&1)"
        rc=$?
        set -e
        git worktree remove --force "$wt"
        [ "$rc" = "0" ] || { echo "$out"; echo "release: ${sha} does not build from published modules (see above)." >&2; exit 1; }
        # CI must have passed on exactly this commit.
        passed="$(gh run list --repo spectrum-labs-tech/hospitium-agent --workflow ci.yaml --commit "$sha" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
        [ "$passed" != "0" ] || { echo "CI has not passed on ${sha}. Wait for it or fix it: gh run list --commit ${sha}" >&2; exit 1; }
        if [ -n "$dry" ]; then echo "release: DRY_RUN, every check passed; would tag ${new} at ${sha}."; exit 0; fi
        git tag -a "$new" -m "$new" "$sha"
        git push origin "$new"
        echo "release: pushed ${new} at ${sha}. release.yaml publishes the binaries."

  release:next:
    desc: "Print the version after LATEST for BUMP (the one implementation release and release:check share)"
    silent: true
    requires:
      vars: [LATEST, BUMP]
    cmds:
      - |
        set -eu
        latest="{{.LATEST}}"
        bump="{{.BUMP}}"
        case "$latest" in
          *-*|*+*) echo "LATEST must be a plain vX.Y.Z; these repos don't use pre-release tags (got '$latest')" >&2; exit 1 ;;
          v[0-9]*.[0-9]*.[0-9]*) : ;;
          *) echo "LATEST must be vX.Y.Z (got '$latest')" >&2; exit 1 ;;
        esac
        case "$bump" in major|minor|patch) : ;; *) echo "BUMP must be major|minor|patch (got '$bump')" >&2; exit 1 ;; esac
        v="${latest#v}"
        maj="${v%%.*}"
        rest="${v#*.}"
        min="${rest%%.*}"
        pat="${rest#*.}"
        if [ "$bump" = "major" ]; then
          maj=$((maj + 1)); min=0; pat=0
        elif [ "$bump" = "minor" ]; then
          min=$((min + 1)); pat=0
        else
          pat=$((pat + 1))
        fi
        echo "v${maj}.${min}.${pat}"

  release:check:
    desc: Self-test the release version arithmetic in task's own shell (where it actually runs)
    silent: true
    cmds:
      - |
        set -eu
        fail=0
        for c in v1.1.8:patch:v1.1.9 v1.1.8:minor:v1.2.0 v1.1.8:major:v2.0.0 v0.0.0:minor:v0.1.0 v0.2.0:minor:v0.3.0 v0.9.9:minor:v0.10.0 v0.10.0:patch:v0.10.1; do
          latest="${c%%:*}"
          rest="${c#*:}"
          bump="${rest%%:*}"
          want="${rest#*:}"
          got="$({{.TASK_EXE}} release:next LATEST="$latest" BUMP="$bump")"
          if [ "$got" = "$want" ]; then echo "  ok   ${latest} ${bump} -> ${got}"; else echo "  FAIL ${latest} ${bump} -> ${got} (want ${want})"; fail=1; fi
        done
        [ "$fail" = "0" ] || { echo "release arithmetic is WRONG; do not cut a release" >&2; exit 1; }
        echo "release arithmetic ok"
